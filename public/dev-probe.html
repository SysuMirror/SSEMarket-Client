<!doctype html><meta charset=utf-8><title>dev probe</title>
<body style="margin:0">
<pre id="out" style="position:fixed;left:8px;top:8px;z-index:9;display:none">booting…</pre>
<iframe id="f" style="position:fixed;left:0;top:0;width:100vw;height:100vh;border:0"></iframe>
<script>
var q=new URLSearchParams(location.search);
var MODE=q.get('mode')||'';
var f=document.getElementById('f');
var out=document.getElementById('out');
if(!q.get('rt')){ out.style.display='block'; out.textContent='missing rt'; }
else{
localStorage.setItem('rememberMe','true');
localStorage.setItem('refreshToken',q.get('rt'));
localStorage.setItem('refreshTokenExpiry',String(Date.now()+7*864e5));
f.src='/new/smart-xiaoqiu';
var tries=0;
var t=setInterval(function(){
  tries++;
  var d=f.contentDocument; if(!d){return}
  var bar=d.querySelector('.top-bar');
  if(!bar){ if(tries>30){clearInterval(t);out.style.display='block';out.textContent='TIMEOUT '+f.contentWindow.location.pathname;} return }
  clearInterval(t);
  if(MODE==='drawer'||MODE==='sidebar'){
    setTimeout(function(){
      var target=null;
      if(MODE==='drawer'){ [].forEach.call(d.querySelectorAll('.top-actions .ghost-btn'),function(b){ if((b.getAttribute('aria-label')||'').indexOf('记忆')>=0) target=b; }); }
      else { target=d.querySelector('.icon-menu'); }
      if(target){ target.click(); }
      setTimeout(function(){
        var sel = MODE==='drawer' ? '.memory-drawer' : '.side-mobile-mask';
        var el = d.querySelector(sel);
        var r = el ? el.getBoundingClientRect() : null;
        var w2 = f.contentWindow;
        out.style.display='block';
        out.textContent='STATE='+JSON.stringify({mode:MODE, open:!!el,
          rect: r?{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}:null,
          z: el?w2.getComputedStyle(el).zIndex:null,
          coversHeader: r?(r.y<=44):null});
      },2000);
    },1500);
    return;
  }
  setTimeout(function(){
    var w=f.contentWindow;
    var q2=function(s){return d.querySelector(s)};
    var info=function(el){ if(!el)return null; var r=el.getBoundingClientRect(); var c=w.getComputedStyle(el);
      return {x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height),display:c.display}; };
    var out2={vp:{w:w.innerWidth,h:w.innerHeight},docSW:dd2().scrollWidth,
      topBar:info(q2('.top-bar')),iconMenu:info(q2('.icon-menu')),
      iconSvg:(function(){var s=q2('.icon-menu svg');if(!s)return null;var r=s.getBoundingClientRect();return {w:Math.round(r.width),h:Math.round(r.height)}})(),
      composer:info(q2('.composer')),overflow:[].map.call(dd2().querySelectorAll('.smart-page *'),function(e){return e}).filter(function(e){return e.getBoundingClientRect().right>w.innerWidth+1}).slice(0,8).map(function(e){return (String(e.className)||e.tagName).slice(0,50)})};
    function dd2(){return d}
    document.getElementById('out').textContent='PROBE='+JSON.stringify(out2);
    var nb=null;
    [].forEach.call(d.querySelectorAll('.top-actions .ghost-btn'),function(b){ if((b.getAttribute('aria-label')||'').indexOf('新对话')>=0) nb=b; });
    if(nb){ nb.click(); }
    setTimeout(function(){
      var sr=q2('.sug-row');
      var chips=[].map.call(d.querySelectorAll('.sug-chip'),function(c){var r=c.getBoundingClientRect();return {w:Math.round(r.width),right:Math.round(r.right)}});
      var comp=q2('.composer');
      var o3={sugRow:(function(){if(!sr)return null;var r=sr.getBoundingClientRect();return {y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})(),chips:chips,
        overlap:(function(){if(!sr||!comp)return null;var a=sr.getBoundingClientRect();var b=comp.getBoundingClientRect();return !(a.bottom<=b.top)})()};
      document.getElementById('out').textContent='CHIPS='+JSON.stringify(o3);
    },3500);
  },1500);
},1200);
}
</script>
