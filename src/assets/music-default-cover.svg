<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2a47"/>
      <stop offset="1" stop-color="#0d1728"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.25" r="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="300" height="300" fill="url(#bg)"/>
  <rect width="300" height="300" fill="url(#sheen)"/>

  <!-- 唱片沟纹 -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5">
    <circle cx="150" cy="150" r="132"/>
    <circle cx="150" cy="150" r="110"/>
    <circle cx="150" cy="150" r="88"/>
    <circle cx="150" cy="150" r="66"/>
    <circle cx="150" cy="150" r="44"/>
  </g>

  <!-- 红色点缀弧 -->
  <circle cx="150" cy="150" r="122" fill="none" stroke="#ec4141" stroke-opacity="0.85"
          stroke-width="3.5" stroke-linecap="round"
          stroke-dasharray="184 583" transform="rotate(-30 150 150)"/>

  <!-- 八分音符 -->
  <g fill="#ffffff">
    <ellipse cx="128" cy="196" rx="25" ry="18" transform="rotate(-18 128 196)"/>
    <rect x="149" y="96" width="7.5" height="104" rx="3.75"/>
    <path d="M156.5 96 C 192 108, 204 142, 184 172 C 196 140, 186 120, 156.5 114 Z"/>
  </g>

  <text x="150" y="280" text-anchor="middle" fill="#ffffff" fill-opacity="0.4"
        font-family="Ubuntu Mono, Arial, sans-serif" font-size="13" letter-spacing="4">SSE MUSIC</text>
</svg>
